services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-metering}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-metering}
      POSTGRES_DB: ${POSTGRES_DB:-metering}
    ports:
      - "${DB_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-metering} -d ${POSTGRES_DB:-metering}"]
      interval: 5s
      timeout: 3s
      retries: 10

  metering:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-metering}:${POSTGRES_PASSWORD:-metering}@db:5432/${POSTGRES_DB:-metering}
      PORT: "3000"
    ports:
      - "${SERVICE_PORT:-3000}:3000"

  client:
    build: ./client
    depends_on:
      - metering
    environment:
      METERING_URL: http://metering:3000
      PORT: "4000"
    ports:
      - "${CLIENT_PORT:-4000}:4000"

volumes:
  pgdata:
